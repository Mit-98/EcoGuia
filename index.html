    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <img src="ecoguia.png" alt="Logo EcoGuia">

    <main>
        <section>
        <form onsubmit="pesquisar(); return false;" aria-label="Pesquisar cidade para coleta">

        </form>
        </section>


         <section class="resultados-pesquisa" id="resultados-pesquisa">

         </section>

    </main>
